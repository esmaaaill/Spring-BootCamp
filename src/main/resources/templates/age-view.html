<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="padding: 20px; background-color: #f0f0f0;">
    <div class="container" style="background: white; border: 2px solid red; border-radius: 10px; padding: 20px; width: 500px;">
        <h1 style="color: blue;">Task 1</h1>
        <p style="font-weight: bold; font-style: italic;">Create an app to calculate the Age by using Spring MVC</p>
        
        <form action="/processAge" method="get">
            <div style="margin-bottom: 10px;">
                <label style="width: 100px;">Year:</label>
                <input type="text" name="year" style="width: 150px; border: 1px solid green;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 100px;">Month:</label>
                <input type="text" name="month" style="width: 150px; border: 1px solid green;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="width: 100px;">Day:</label>
                <input type="text" name="day" style="width: 150px; border: 1px solid green;">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px; background-color: purple;">Calculate</button>
        </form>

        <div th:if="${res != null}" style="margin-top: 20px; padding: 10px; background-color: yellow; border: 1px dashed black; color: red;">
            <p style="font-size: 20px; font-weight: bold;">Your Age is: <span th:text="${res}"></span></p>
        </div>
    </div>
</body>
</html>
