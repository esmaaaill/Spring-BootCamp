<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submission Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                <div class="alert alert-success border-0 shadow-sm mb-4">
                    <h4 class="alert-heading mb-0">Data submitted successfully</h4>
                </div>
                <div class="card shadow-sm border-0 p-4 text-start">
                    <div class="mb-3">
                        <strong>Username:</strong>
                        <span th:text="${user.usrname}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Email address:</strong>
                        <span th:text="${user.email}"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Password:</strong>
                        <span th:text="${user.passwrod}"></span>
                    </div>
                    <a href="/profileForm" class="btn btn-outline-primary mt-3 w-100">Register Another Employee</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
