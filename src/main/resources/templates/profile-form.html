<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="mb-4">Employee Registration Form</h2>
                    <form th:action="@{/submitProfile}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" th:field="*{usrname}" class="form-control" placeholder="Enter Username">
                            <div th:if="${#fields.hasErrors('usrname')}" th:errors="*{usrname}" class="text-danger mt-1"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="text" th:field="*{email}" class="form-control" placeholder="Enter Email Address">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger mt-1"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{passwrod}" class="form-control">
                            <div th:if="${#fields.hasErrors('passwrod')}" th:errors="*{passwrod}" class="text-danger mt-1"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger mt-1"></div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-2">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
